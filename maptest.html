<!DOCTYPE html>
<html lang="et"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maa-ameti kaardiserveri test</title>
<style>
body{font-family:-apple-system,Segoe UI,Roboto,sans-serif;margin:12px;max-width:760px}
h1{font-size:18px} .row{display:flex;gap:10px;align-items:center;border:1px solid #ccc;border-radius:6px;padding:8px;margin:8px 0}
.row img{width:96px;height:96px;object-fit:cover;background:#eee;border:1px solid #bbb}
.ok{color:#0a7a2f;font-weight:700}.bad{color:#b00020;font-weight:700} small{color:#555;word-break:break-all}
pre{white-space:pre-wrap;background:#f4f4f4;padding:8px;border-radius:6px;font-size:12px}
</style></head><body>
<h1>Maa-ameti kaardiserveri test</h1>
<p>Iga rida proovib laadida ühe kaardiplaadi (Tallinna kesklinn). Roheline = pilt tuli, punane = ebaõnnestus. Saada mulle ekraanipilt.</p>
<div id="rows"></div>
<h1>Kihtide nimed (GetCapabilities)</h1><pre id="caps">laen…</pre>
<script>
const BBOX="2755000,8036000,2756000,8037000";
const base=(u,l,f,extra)=>`${u}${u.includes("?")?"&":"?"}SERVICE=WMS&VERSION=1.1.1&REQUEST=GetMap&LAYERS=${l}&STYLES=&FORMAT=${f}&SRS=EPSG:3857&BBOX=${BBOX}&WIDTH=256&HEIGHT=256${extra||""}`;
const alus=(l)=>`https://kaart.maaamet.ee/wms/alus-geo?SERVICE=WMS&VERSION=1.3.0&REQUEST=GetMap&LAYERS=${l}&STYLES=&FORMAT=image/png&CRS=EPSG:3857&BBOX=${BBOX}&WIDTH=256&HEIGHT=256`;
const WIDE="2915000,7980000,3035000,8100000"; // ca 120 km, madal suum (~zoom 9-10)
const wide13=(u,l,crs)=>`${u}?SERVICE=WMS&VERSION=1.3.0&REQUEST=GetMap&LAYERS=${l}&STYLES=&FORMAT=image/jpeg&CRS=${crs}&BBOX=${WIDE}&WIDTH=256&HEIGHT=256`;
const wide11=(u,l)=>`${u}?SERVICE=WMS&VERSION=1.1.1&REQUEST=GetMap&LAYERS=${l}&STYLES=&FORMAT=image/jpeg&SRS=EPSG:3857&BBOX=${WIDE}&WIDTH=256&HEIGHT=256`;
const tests=[
 ["MADAL SUUM: alus-geo of10000 (oodatud tühi)", wide13("https://kaart.maaamet.ee/wms/alus-geo","of10000","EPSG:3857")],
 ["MADAL SUUM: alus-geo EESTIFOTO 3857", wide13("https://kaart.maaamet.ee/wms/alus-geo","EESTIFOTO","EPSG:3857")],
 ["MADAL SUUM: fotokaart EESTIFOTO 1.3.0 3857", wide13("https://kaart.maaamet.ee/wms/fotokaart","EESTIFOTO","EPSG:3857")],
 ["MADAL SUUM: fotokaart EESTIFOTO 1.1.1 3857", wide11("https://kaart.maaamet.ee/wms/fotokaart","EESTIFOTO")],
 ["MADAL SUUM: fotokaart MA-FOTOKAART 1.1.1 3857", wide11("https://kaart.maaamet.ee/wms/fotokaart","MA-FOTOKAART")],
 ["LÄHI SUUM: alus-geo of10000 (töötab)", alus("of10000")],
 ["LÄHI SUUM: fotokaart EESTIFOTO 1.1.1 3857", base("https://kaart.maaamet.ee/wms/fotokaart","EESTIFOTO","image/jpeg")],
 ["Põhiserver: Ortofoto (tm foto)", base("https://tiles.maaamet.ee/tm/wms","foto","image/jpeg")]
];
const rows=document.getElementById("rows");
tests.forEach(([name,url])=>{
  const d=document.createElement("div");d.className="row";
  const img=new Image();const t0=performance.now();
  const s=document.createElement("div");
  const b=document.createElement("b");b.textContent=name;
  const st=document.createElement("span");st.textContent="laen…";
  const sm=document.createElement("small");sm.textContent=url;
  s.appendChild(b);s.appendChild(document.createElement("br"));s.appendChild(st);s.appendChild(document.createElement("br"));s.appendChild(sm);
  let done=false;
  img.onload=()=>{done=true;st.className="ok";st.textContent="OK ("+Math.round(performance.now()-t0)+" ms, "+img.naturalWidth+"x"+img.naturalHeight+")"};
  img.onerror=()=>{done=true;st.className="bad";st.textContent="EBAÕNNESTUS (server vastas veaga või blokeeriti, "+Math.round(performance.now()-t0)+" ms)"};
  setTimeout(()=>{if(!done){st.className="bad";st.textContent="AEG ÜLES (15 s, server ei vasta)"}},15000);
  img.src=url;d.appendChild(img);d.appendChild(s);rows.appendChild(d);
});

const caps=document.getElementById("caps");
const capUrls=["https://tiles.maaamet.ee/tm/wms?SERVICE=WMS&REQUEST=GetCapabilities","https://kaart.maaamet.ee/wms/alus-geo?SERVICE=WMS&VERSION=1.3.0&REQUEST=GetCapabilities"];
caps.textContent="";
async function readCaps(u){
  try{
    const r=await fetch(u);const t=await r.text();
    const names=[...t.matchAll(/<Layer[^>]*>\s*<Name>([^<]+)<\/Name>/g)].map(m=>m[1]);
    return u.split("/")[2]+" -> "+(names.length?names.join(", "):"vastus ilma kihtideta: "+t.slice(0,120).replace(/\s+/g," "));
  }catch(e){
    return u.split("/")[2]+" -> ei saa lugeda ("+e.message+")";
  }
}
Promise.all(capUrls.map(readCaps)).then(a=>{caps.textContent=a.join("\n\n")});
</script></body></html>
